version: '3.8'

services:
  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: deploy
    env_file: .env.local
    ports:
      - 8000:8000
    container_name: auth
    restart: always
    networks:
      - network

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: deploy
    env_file: .env.local
    ports:
      - 8000:8000
    container_name: backend
    restart: always
    networks:
      - network

  postgres:
    container_name: pg
    image: timescale/timescaledb:latest-pg16
    ports:
      - 5432:5432
    env_file: .env.local
    environment:
      TZ: Asia/Seoul
    restart: always
    networks:
      - network
    volumes:
      - postgres:/var/lib/postgresql/data

  nginx:
    container_name: hermai-os-nginx
    image: nginx:latest
    restart: always
    ports:
      - 80:80
    networks:
      - network

networks:
  central-network:
    driver: bridge

volumes:
  postgres:
